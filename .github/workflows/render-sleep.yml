name: Render Sleep Wake Schedule

on:
  schedule:
    - cron: '30 19 * * *'   # SUSPEND — 1:00 AM IST = 7:30 PM UTC
    - cron: '0 1 * * *'     # RESUME  — 6:30 AM IST = 1:00 AM UTC
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'resume'
        type: choice
        options:
          - suspend
          - resume

jobs:
  manage-render-services:
    runs-on: ubuntu-latest

    steps:
      - name: Validate secrets
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "$RENDER_SERVICE_IDS" ]; then
            echo "RENDER_SERVICE_IDS secret is not set"
            exit 1
          fi
          echo "All secrets present"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_IDS: ${{ secrets.RENDER_SERVICE_IDS }}

      - name: Determine action
        id: action
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ github.event.inputs.action }}"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "19" ]; then
              ACTION="suspend"
            else
              ACTION="resume"
            fi
          fi
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "Action: $ACTION"

      - name: Verify Render API key
        env:
          RENDER_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          HTTP_CODE=$(curl -s -o /tmp/render_services.json -w "%{http_code}" \
            -H "Authorization: Bearer ${RENDER_KEY}" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services?limit=10")

          echo "API key check: HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "API key is valid. Your services:"
            jq -r '.[] | "  - \(.service.id) | \(.service.name) | \(.service.type)"' /tmp/render_services.json 2>/dev/null || cat /tmp/render_services.json
          else
            echo "API key check failed:"
            cat /tmp/render_services.json
            exit 1
          fi

      - name: Suspend or Resume Render services
        env:
          RENDER_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_IDS: ${{ secrets.RENDER_SERVICE_IDS }}
          ACTION: ${{ steps.action.outputs.action }}
        run: |
          SUCCESS=0
          FAIL=0

          echo "Action: $ACTION"
          echo "Service IDs: $SERVICE_IDS"
          echo ""

          for SERVICE_ID in $SERVICE_IDS; do
            echo "Calling: POST /v1/services/${SERVICE_ID}/${ACTION}"

            HTTP_CODE=$(curl -s -o /tmp/render_resp.json -w "%{http_code}" \
              -X POST \
              "https://api.render.com/v1/services/${SERVICE_ID}/${ACTION}" \
              -H "Authorization: Bearer ${RENDER_KEY}" \
              -H "Accept: application/json")

            BODY=$(cat /tmp/render_resp.json)
            echo "HTTP $HTTP_CODE | $BODY"

            if echo "$HTTP_CODE" | grep -qE '^(200|201|202|204)$'; then
              echo "SUCCESS: $SERVICE_ID"
              SUCCESS=$((SUCCESS + 1))
            else
              echo "FAILED: $SERVICE_ID (HTTP $HTTP_CODE)"
              FAIL=$((FAIL + 1))
            fi
            echo ""
          done

          echo "Success: $SUCCESS | Failed: $FAIL"

          if [ "$FAIL" -gt "0" ]; then
            exit 1
          fi

      - name: Pause or Resume UptimeRobot monitors
        env:
          UR_API_KEY: ${{ secrets.UPTIMEROBOT_API_KEY }}
          UR_MONITOR_IDS: ${{ secrets.UPTIMEROBOT_MONITOR_IDS }}
          ACTION: ${{ steps.action.outputs.action }}
        run: |
          if [ -z "$UR_API_KEY" ]; then
            echo "UPTIMEROBOT_API_KEY not set, skipping"
            exit 0
          fi

          if [ "$ACTION" = "suspend" ]; then
            UR_STATUS=1
            LABEL="Pausing"
          else
            UR_STATUS=0
            LABEL="Resuming"
          fi

          echo "$LABEL UptimeRobot monitors..."

          for MONITOR_ID in $UR_MONITOR_IDS; do
            RESPONSE=$(curl -s -X POST "https://api.uptimerobot.com/v2/editMonitor" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "api_key=${UR_API_KEY}&id=${MONITOR_ID}&status=${UR_STATUS}")

            if echo "$RESPONSE" | grep -q '"stat":"ok"'; then
              echo "Monitor $MONITOR_ID: OK"
            else
              echo "Monitor $MONITOR_ID: non-critical warn: $RESPONSE"
            fi
          done

      - name: Summary
        env:
          ACTION: ${{ steps.action.outputs.action }}
        run: |
          IST_TIME=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')
          if [ "$ACTION" = "suspend" ]; then
            echo "All services suspended at $IST_TIME. Next wake: 6:30 AM IST"
          else
            echo "All services resumed at $IST_TIME. Next sleep: 1:00 AM IST"
          fi
