
server:
  port: ${PORT:8081}

spring:
    application:
      name: auth-service
    data:
      mongodb:
        uri: ${MONGO_URI}
    mail:
      host: smtp.gmail.com
      port: 587
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true
            connectiontimeout: 5000   # 5s to establish connection
            timeout: 5000             # 5s read timeout
            writetimeout: 5000        # 5s write timeout


jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000